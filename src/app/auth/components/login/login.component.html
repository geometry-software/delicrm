<ng-container *ngIf="!(isAdminUser | async)">
  <mat-tab-group [@.disabled]="true">
    <mat-tab [label]="'AUTH.LOGIN.EMPLOYEE.TITLE' | translate">
      <br>
      <div class="action-bar">
        <button class="social-button" (click)="loginUser()">
          <img [src]="googleIconPath" width="40px" height="40px" />
          {{ 'AUTH.LOGIN.EMPLOYEE.GOOGLE_BUTTON_TITLE' | translate }}
        </button>
      </div>
    </mat-tab>
    <mat-tab [label]="'AUTH.LOGIN.ADMIN.TITLE' | translate">
      <br>
      <form [formGroup]="form" (ngSubmit)="submitAdminLoginForm()">
        <mat-form-field [hideRequiredMarker]="true">
          <mat-label> {{ 'AUTH.LOGIN.ADMIN.EMAIL' | translate }} </mat-label>
          <input matInput [formControlName]="formProps.email" />
          <mat-error *ngIf="showFieldErrors(form, formProps.email) as error">
            {{ error | translate }}
          </mat-error>
        </mat-form-field>

        <mat-form-field [hideRequiredMarker]="true">
          <mat-label> {{ 'AUTH.LOGIN.ADMIN.PASSWORD' | translate }} </mat-label>
          <input matInput [formControlName]="formProps.password" />
          <mat-error *ngIf="showFieldErrors(form, formProps.password) as error">
            {{ error | translate }}
          </mat-error>
        </mat-form-field>

        <app-button action="save" width="full" type="submit" [disabled]="isAdminLoginLoading"
          [title]="isAdminLoginLoading ?  'AUTH.LOGIN.ADMIN.BUTTON.LOADING' : 'AUTH.LOGIN.ADMIN.BUTTON.ACTION'" />
      </form>
    </mat-tab>
  </mat-tab-group>
</ng-container>

<ng-container *ngIf="isAdminUser | async">

  <ng-container *ngIf="isRequestedAuth | async as displayName; else adminTemplate">
    <app-title [title]="getNameTitle(displayName)" subtitle="AUTH.LOGIN.EMPLOYEE.LOGIN_CONFIRMATION"
      [disableTranslateTitle]="true" />
    <button mat-stroked-button class="login-button" routerLink="/auth/profile">
      {{ 'AUTH.LOGIN.EMPLOYEE.PROFILE_BUTTON' | translate }}
    </button>
  </ng-container>

  <ng-template #adminTemplate>
    <ng-container
      *ngIf="(adminEmailWasVerified | async ) && (restaurantRegisterStatus | async) as status; else confirmedEmail">
      <app-title title='AUTH.ADMIN.EMAIL.CONFIRMED.TITLE' subtitle='AUTH.ADMIN.EMAIL.CONFIRMED.SUBTITLE' />

      <app-button title="AUTH.ADMIN.REGISTER_RESTAURANT.BUTTON" action="save" (submit)="registerRestaurant()" />

      <ng-container [ngSwitch]="status">
        <ng-container *ngSwitchCase="RestaurantLoadingStatus.Registering">
          <div class="text-loading">
            {{ 'AUTH.ADMIN.REGISTER_RESTAURANT.LOADING' | translate }}
          </div>
        </ng-container>
        <ng-container *ngSwitchCase="RestaurantLoadingStatus.RegisterSuccess">
          <div style="color: teal">
            <app-button title="AUTH.ADMIN.EMAIL.BUTTON.UPDATE" (submit)="update()" />
          </div>
        </ng-container>
        <ng-container *ngSwitchCase="RestaurantLoadingStatus.RegisterFailed">
          <div style="color: tomato">
            {{ 'AUTH.ADMIN.REGISTER_RESTAURANT.ERROR' | translate }}
            <b>{{ registerRestaurantErrorMessage }}</b>
          </div>
        </ng-container>
      </ng-container>
    </ng-container>
  </ng-template>

  <ng-template #confirmedEmail>
    <app-title title="AUTH.ADMIN.EMAIL.CONFIRM.TITLE" subtitle="AUTH.ADMIN.EMAIL.CONFIRM.SUBTITLE" />
    <div class="flex gap-[10px]">
      <app-button title="AUTH.ADMIN.EMAIL.BUTTON.UPDATE" (submit)="update()" />
      <app-button title="AUTH.ADMIN.EMAIL.BUTTON.RESEND" action="save" (submit)="sendEmail()" />
    </div>
  </ng-template>
</ng-container>
