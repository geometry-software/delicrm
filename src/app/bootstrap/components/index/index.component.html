<ng-container *ngIf="restaurantInfo | async as info">
  <div class="title">{{info.restaurant?.name}}</div>
  <div class="subtitle">{{info.restaurant?.description}}</div>
</ng-container>
<div class="flex flex-col align-items">
  <div class="gallery-container">
    <img class="mySlides fade" src="assets/images/bg/bg_3.jpg" width="100%" height="300px" />
    <img class="mySlides fade" src="assets/images/bg/bg_4.jpg" width="100%" height="300px" />
    <img class="mySlides fade" src="assets/images/bg/bg_5.jpg" width="100%" height="300px" />
    <img class="mySlides fade" src="assets/images/bg/bg_1.jpg" width="100%" height="300px" />
    <img class="mySlides fade" src="assets/images/bg/bg_2.jpg" width="100%" height="300px" />
  </div>
  <button class="delivery-button" [routerLink]="['menu']">
    <div class="flex items-center">
      <div style="min-height: 100%; display: flex; align-items: center">
        <mat-icon style="margin-right: 10px">shopping_basket</mat-icon>
      </div>
      <div style="
          min-height: 100%;
          font-size: 1.3em;
          font-weight: 500;
          letter-spacing: 2px;
        ">
        {{ 'SHARED.INDEX_DELIVERY_BUTTON' | translate }}
      </div>
    </div>
  </button>
</div>
