<div class="flex gap-2">
  <ng-container [ngSwitch]="currentRoute">

    <!-- BOARD -->
    <ng-container *ngSwitchCase="imageRoute">
      <app-button title="ADMIN.BOARD.BUTTON.CLOSE" [disabled]="disabledMenu | async" action="back"
        icon="cleaning_services" (click)="clearMenu()" />
      <app-button title="ADMIN.BOARD.BUTTON.DOWNLOAD" [disabled]="disabledMenu | async" action="back" icon="image"
        (click)="printMenu()" />
      <app-button title="ADMIN.BOARD.BUTTON.UPDATE" [disabled]="!(disabledMenu | async)" action="back" icon="edit"
        url="daily" />
      <app-button title="ADMIN.BOARD.BUTTON.ALACARTE" action="back" icon="local_drink" url="alacarte" />
      <app-button title="ADMIN.BOARD.BUTTON.CONFIG" [disabled]="(loadingStatus | async) === LoadingStatus.Loading"
        action="back" icon="settings" (click)="updateRestaurant()" />
    </ng-container>

    <!-- DAILY MENU -->
    <ng-container *ngSwitchCase="formRoute">
      <app-button title="ADMIN.BOARD.BUTTON.BACK" action="back" icon="arrow_back" url="/board" />
      <app-button title="ADMIN.BOARD.BUTTON.COPY" action="back" icon="refresh" (click)="copy()" />
      <app-button title="ADMIN.BOARD.BUTTON.REBUILD" action="back" icon="refresh" (click)="rebuild()" />
    </ng-container>

    <!-- ALA CARTE MENU -->
    <ng-container *ngSwitchCase="alacarteRoute">
      <app-button title="ADMIN.BOARD.BUTTON.BACK" action="back" icon="arrow_back" url="/board" />
    </ng-container>

  </ng-container>
</div>

<router-outlet></router-outlet>
