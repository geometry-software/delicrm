<ng-container *ngIf="dailyMenu | async as menu">

  <ng-container *ngIf="!menu.open; else menuTemplate">
    <div class="no-menu">Menu is not published</div>
  </ng-container>

  <ng-template #menuTemplate>
    <div style="display: flex; justify-content: center">
      <div id="print" style="width: 400px">
        <div class="menu__title-border">
          <div class="menu__title">{{ menuTitle }}</div>
          <div class="menu__subtitle">Daily Menu</div>
          <div class="menu__day">{{ today }}</div>
        </div>

        <app-formatted-daily-menu [dailyMenu]="menu" [currency]="currency | async"></app-formatted-daily-menu>

        <div class="contact__border">
          <div class="contact__title">Delivery:<span class="contact__subtitle contact__link">deli-crm.web.app</span>
          </div>
          <div class="contact__title">Address:<span class="contact__subtitle">Street 1, 2</span></div>
          <div class="contact__title">WhatsApp:<span class="contact__subtitle">+1234567890</span></div>
          <div class="contact__footer">We accept all cards, QR and cash</div>
        </div>
      </div>
    </div>
  </ng-template>

</ng-container>
