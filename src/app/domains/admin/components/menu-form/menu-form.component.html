<br />
<mat-stepper [linear]="true" #stepper *ngIf="isFormDataLoaded | async">
  <mat-step [stepControl]="menuForm" label="Choose starters">
    <form [formGroup]="menuForm" (ngSubmit)="addExtras(menuForm, stepper)">

      <div class="section">Starters</div>

      <div formArrayName="starters" *ngFor="let item of getStarters().controls; let i = index">
        <mat-form-field>
          <input type="text" matInput [formControlName]="i" [placeholder]="'Sopa ' + (i + 1)"
            [matAutocomplete]="autoStarter" />
          <mat-autocomplete requireSelection #autoStarter="matAutocomplete" [displayWith]="displayFn">
            <mat-option *ngFor="let option of filteredStarterOptions[i] | async" [value]="option">
              {{ option.name }}
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>
      </div>

      <div class="section">Drinks</div>

      <div formArrayName="drinks" *ngFor="let item of getDrinks().controls; let i = index">
        <mat-form-field>
          <input type="text" matInput [formControlName]="i" [placeholder]="'Juice ' + (i + 1)"
            [matAutocomplete]="autoDrink" />
          <mat-autocomplete requireSelection #autoDrink="matAutocomplete" [displayWith]="displayFn">
            <mat-option *ngFor="let option of filteredDrinkOptions[i] | async" [value]="option">
              {{ option.name }}
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>
      </div>

      <div class="section">Side dishes</div>

      <mat-form-field>
        <input type="text" matInput formControlName="salad" placeholder="Salad" [matAutocomplete]="autoSalad" />
        <mat-autocomplete requireSelection #autoSalad="matAutocomplete" [displayWith]="displayFn">
          <mat-option *ngFor="let option of filteredSaladOptions | async" [value]="option">
            {{ option.name }}
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>

      <mat-form-field>
        <input type="text" matInput formControlName="rice" placeholder="Rice" [matAutocomplete]="autoRice" />
        <mat-autocomplete requireSelection #autoRice="matAutocomplete" [displayWith]="displayFn">
          <mat-option *ngFor="let option of filteredRiceOptions | async" [value]="option">
            {{ option.name }}
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>

      <mat-form-field>
        <input type="text" matInput formControlName="garnish" placeholder="Garnish" [matAutocomplete]="autoGarnish" />
        <mat-autocomplete requireSelection #autoGarnish="matAutocomplete" [displayWith]="displayFn">
          <mat-option *ngFor="let option of filteredGarnishOptions | async" [value]="option">
            {{ option.name }}
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>

      <mat-form-field>
        <input type="text" matInput formControlName="dessert" placeholder="Dessert" [matAutocomplete]="autoDessert" />
        <mat-autocomplete requireSelection #autoDessert="matAutocomplete" [displayWith]="displayFn">
          <mat-option *ngFor="let option of filteredDessertOptions | async" [value]="option">
            {{ option.name }}
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>

      <div *ngIf="hasStartersValidationError" class="validation-error-message">Not all positions were chosen</div>
      <app-button title="Add starters and drinks" type="submit" width="full"></app-button>
    </form>
  </mat-step>

  <mat-step label="Add main dishes">
    <form [formGroup]="plateForm" (ngSubmit)="choosePlates(stepper)">
      <div class="section">Main dishes</div>

      <div class="flex items-center" *ngFor="let item of plateList; let i = index">
        <mat-checkbox [checked]="item.isAdded" (change)="addPlate(item)">
          <span class="main-dish">{{ item.name }}</span>
        </mat-checkbox>
      </div>

      <div class="plates-result-amount">{{ chosenPlates.length }} plates</div>
      <app-button title="Add main dishes" type="submit" width="full"></app-button>
    </form>
  </mat-step>
  <mat-step [stepControl]="plateForm" label="Confirm">
    <ng-container *ngIf="dailyMenu.main">
      <app-formatted-daily-menu [dailyMenu]="dailyMenu" [currency]="currency | async" />
      <br />
      <app-button [title]="!(isLoading | async) ? 'Update menu and open a service' : 'Loading ..'"
        [disabled]="(isLoading | async)" actionType="save" [width]="'full'" (click)="createDailyMenu()"></app-button>
    </ng-container>
  </mat-step>
</mat-stepper>
