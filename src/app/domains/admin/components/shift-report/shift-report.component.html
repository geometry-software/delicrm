<ng-container *ngIf="shift | async as item">

  <app-title title="SHIFTS.DETAIL.TITLE" [subtitle]="getDateFromUnix(item.createdAt)"
    [disableTranslateSubtitle]="true" />

  <app-title-item title="SHIFTS.DETAIL.PLATES" [value]="item.totalOrders" />
  <app-title-item title="SHIFTS.DETAIL.TOTAL" [value]="item.totalPrice" />
  <app-title-item title="TIMESTAMP.CREATED_AT" [value]=" getTimeFromUnix(item.createdAt)" />
  <app-title-item title="TIMESTAMP.CLOSED_AT" [value]="getTimeFromUnix(item.closedAt)" />

</ng-container>
