<ng-container *ngIf="shift | async as item">

  <app-title title="Shift details" [subtitle]="getDateFromUnix(item.createdAt) " />

  <app-title-item title="Total Orders" [value]="item.totalOrders" />
  <app-title-item title="Total Price" [value]="item.totalPrice" />
  <app-title-item title="Created At" [value]=" getTimeFromUnix(item.createdAt)" />
  <app-title-item title="Closed At" [value]="getTimeFromUnix(item.closedAt)" />

</ng-container>
