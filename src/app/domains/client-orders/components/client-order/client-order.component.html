<ng-container class="p-[3px]" *ngIf="{ auth: auth | async, user: user | async, delivery: delivery | async } as data">
  <ng-container *ngIf="data.delivery && (data.auth || data.user)">
    <ng-container *ngIf="data.auth; else userActions">
      <div class="card mb-[20px]" [@fadeInOnEnter]>
        <div class="name-title">
          {{ 'DELIVERY.DETAIL.THANKS' | translate}}
          <br>
          {{ data.delivery.createdByClient.name }}!
        </div>
        <div class="text-center my-[30px]">
          <img src="/assets/images/done.png" width="150px" height="150px" />
        </div>
      </div>
    </ng-container>
    <ng-template #userActions>
      <div class="user-actions">
        <app-button title="DELIVERY.DETAIL.BUTTON.BACK" actionType="back" icon="arrow_back" url="/delivery" />
        <app-button title="DELIVERY.DETAIL.BUTTON.UPDATE" [disabled]="(loadingStatus | async) === LoadingStatus.Loading"
          icon="arrow_forward" (click)="update()" />
      </div>
    </ng-template>

    <div class="card">
      <div class="flex justify-between items-center">
        <div class="progress">
          <div [style.width]="deliveryStatusBar.progress" [style.background]="statusColor[deliveryStatusBar.status]">
            <span class="material-symbols-outlined icon"> {{ statusIcon[deliveryStatusBar.status] }} </span>
            {{ deliveryTanslate[deliveryStatusBar.status] | translate }}
          </div>
        </div>
      </div>

      <div *ngFor="let item of data.delivery.order.main; let i = index; let last = last">
        <div class="item-card" [@pulseOnEnter]>
          <div class="flex items-center">
            <img [src]="setProteinImage(item.plate.protein)" width="30px" height="30px" />
            <div class="item__title">
              {{ item.plate.name }}
            </div>
          </div>
          <div class="item__price">{{ item.plate.price }} {{ data.delivery.order.price.currency }}</div>
        </div>
        <div class="divider" *ngIf="!last"></div>
      </div>
    </div>

    <div class="card mt-[20px]">
      <div class="flex justify-between">
        <app-title-item title="DELIVERY.DETAIL.ADDRESS" [value]="data.delivery.deliveryInfo.address " />
        <button *ngIf="data.user" mat-icon-button (click)="copyAddress(data.delivery)" onclick="this.blur()">
          <mat-icon class="menu-icon"> pin_drop </mat-icon>
        </button>
      </div>
      <div class="flex justify-between">
        <app-title-item title="DELIVERY.DETAIL.PHONE" [value]="data.delivery.deliveryInfo.phone " />
        <button *ngIf="data.user" mat-icon-button (click)="copyPhone(data.delivery)" onclick="this.blur()">
          <mat-icon class="menu-icon"> call </mat-icon>
        </button>
      </div>
      <app-title-item title="DELIVERY.DETAIL.PAYMENT" [value]="data.delivery.deliveryInfo.payment" />
      <app-title-item *ngIf="data.delivery.deliveryInfo.payment === 'cash'" title="DELIVERY.DETAIL.CHANGE"
        [value]="data.delivery.deliveryInfo.change " />
      <app-title-item margin="0" title="DELIVERY.DETAIL.DELIVERY_TIME" [value]="getDeliveryTime(data.delivery)" />
    </div>

    <div class="card mt-[20px] mb-[10px]">
      <app-title title='MENU.CHECKOUT.TOTAL.TITLE' [subtitle]="getTotal(data.delivery)"
        [disableTranslateSubtitle]="true" />

      <app-title-item title="MENU.CHECKOUT.TOTAL.MENU_PRICE" [value]="getOrderPrice(data.delivery)" />
      <app-title-item title="MENU.CHECKOUT.TOTAL.DELIVERY_PRICE" [value]="getDeliveryPrice(data.delivery)" />
      <app-title-item title="MENU.CHECKOUT.TOTAL.ALACARTE_PRICE" [value]="getAlacartePrice(data.delivery)" margin="0" />
    </div>
  </ng-container>
</ng-container>
