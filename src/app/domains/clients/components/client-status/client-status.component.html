<app-title title="CLIENTS.MODAL.TITLE" subtitle="CLIENTS.MODAL.SUBTITLE" margin="0" />

<mat-radio-group class="radio-group" [(ngModel)]="currentStatus">
  @for (status of statusList; track status) {
  <mat-radio-button class="example-radio-button" [value]="status">{{status}}</mat-radio-button>
  }
</mat-radio-group>

<div class="form-actions">
  <app-button title="CLIENTS.MODAL.BUTTON.CLOSE" action="back" (submit)="close()" />
  <app-button title="CLIENTS.MODAL.BUTTON.UPDATE" action="save" (submit)="confirm()" />
</div>
