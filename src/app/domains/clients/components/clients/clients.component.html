<div class="relative">
  <div class="table-loading-shade" *ngIf="(loadingStatus | async) === LoadingStatus.Loading"></div>
  <mat-tab-group *ngIf="{ list: orderList | async, label: listLabels | async } as data" [@.disabled]="true"
    (selectedTabChange)="changeTab($event)" [(selectedIndex)]="selectedTabIndex">
    <mat-tab [label]="data.label.active">
      <ng-container *ngTemplateOutlet="table; context: { data: data.list }"></ng-container>
    </mat-tab>
    <mat-tab [label]="data.label.requested">
      <ng-container *ngTemplateOutlet="table; context: { data: data.list }"></ng-container>
    </mat-tab>
    <mat-tab [label]="data.label.blocked">
      <ng-container *ngTemplateOutlet="table; context: { data: data.list }"></ng-container>
    </mat-tab>
  </mat-tab-group>
</div>

<ng-template #table let-data="data">
  <mat-table mat-table [dataSource]="data" matSort matSortDisableClear
    [matSortDirection]="defaultSortControlValue.direction" [matSortActive]="defaultSortControlValue.active"
    (matSortChange)="changeSort($event)">
    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef> Name </mat-header-cell>
      <mat-cell *matCellDef="let element">
        <div class="table-link" [routerLink]="['order', element.id]">
          {{ element.name ?? 'No name' }}
        </div>
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="status">
      <mat-header-cell *matHeaderCellDef class="flex justify-center"> Status </mat-header-cell>
      <mat-cell *matCellDef="let element" class="flex justify-center">
        <button mat-icon-button (click)="updateStatus(element)">
          <mat-icon>badge</mat-icon>
        </button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="tableColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: tableColumns"></mat-row>
  </mat-table>
</ng-template>

<app-pagination [paginationControl]="paginationControl" [sizeControl]="sizeControl"
  [paginationPayload]="paginationPayload | async" [loadingStatus]="loadingStatus | async" />
