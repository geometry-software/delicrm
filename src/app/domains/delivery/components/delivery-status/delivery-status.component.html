<app-title title="Order status" subtitle="update order status."></app-title>

<div class="container">
  @for (status of statusList; track status) {
  <button class="action" mat-stroked-button [style.background]="statusColor[status]" (click)="confirm(status)">
    {{ orderTranslate[status] }}
  </button>
  }
</div>

<div class="close">
  <button mat-stroked-button (click)="close()">Close</button>
</div>
