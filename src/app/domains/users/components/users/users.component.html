<div class="relative">
  <div class="table-loading-shade" *ngIf="(loadingStatus | async) === LoadingStatus.Loading"></div>
  <mat-tab-group *ngIf="{ list: userList | async, label: listLabels | async } as data" [@.disabled]="true"
    (selectedTabChange)="changeTab($event)" [(selectedIndex)]="selectedTabIndex">
    <mat-tab [label]="data.label.active | tabLabel">
      <ng-container *ngTemplateOutlet="table; context: { data: data.list }"></ng-container>
    </mat-tab>
    <mat-tab [label]="data.label.requested | tabLabel">
      <ng-container *ngTemplateOutlet="table; context: { data: data.list }"></ng-container>
    </mat-tab>
    <mat-tab [label]="data.label.blocked | tabLabel">
      <ng-container *ngTemplateOutlet="table; context: { data: data.list }"></ng-container>
    </mat-tab>
  </mat-tab-group>
</div>

<ng-template #table let-data="data">
  <mat-table [dataSource]="data">
    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef>
        {{ 'USERS.LIST.TABLE.NAME' | translate }}
      </mat-header-cell>
      <mat-cell *matCellDef="let element">
        <div class="table-link" [routerLink]="['/users', element.id]">
          {{ element.name }}
        </div>
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="role">
      <mat-header-cell *matHeaderCellDef>
        {{ 'USERS.LIST.TABLE.ROLE' | translate }}
      </mat-header-cell>
      <mat-cell *matCellDef="let element">
        <span class="text-ellipsis">
          {{ element.role }}
        </span>
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="status">
      <mat-header-cell *matHeaderCellDef class="flex justify-center"> </mat-header-cell>
      <mat-cell *matCellDef="let element" class="flex justify-center">
        <button mat-icon-button (click)="openStatusForm(element)" onclick="this.blur()">
          <mat-icon>badge</mat-icon>
        </button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="tableColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: tableColumns"></mat-row>
  </mat-table>
</ng-template>
